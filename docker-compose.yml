version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cursos_sgd_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    networks:
      - cursos_sgd_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: cursos_sgd_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cursos_sgd_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cursos_sgd_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cursos_sgd_db"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  cursos_sgd_network:
    driver: bridge

volumes:
  postgres_data:
  app_storage:
  app_public: